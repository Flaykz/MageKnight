services:
  mk-server:
    image: ${MK_SERVER_IMAGE:-ghcr.io/flaykz/mk-server:latest}
    restart: unless-stopped
    environment:
      PORT: "3030"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3030/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mk-client:
    image: ${MK_CLIENT_IMAGE:-ghcr.io/flaykz/mk-client:latest}
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.synology", "--adapter", "caddyfile"]
    ports:
      - "${MK_HTTP_PORT:-8080}:80"
    depends_on:
      mk-server:
        condition: service_healthy
